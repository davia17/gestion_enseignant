version: '3.8'

services:
  # --- 1. BASE DE DONNÉES PostgreSQL ---
  database:
    image: postgres:15-alpine
    container_name: salaires_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: gestion_enseignants
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # --- 2. BACKEND (Node.js / Express / Prisma) ---
  backend:
    build: ./backend
    container_name: salaires_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DATABASE_URL: "postgresql://admin:password123@database:5432/gestion_enseignants?schema=public"
    depends_on:
      - database

  # --- 3. FRONTEND (React / Nginx) ---
  frontend:
    build: ./frontend
    container_name: salaires_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data: